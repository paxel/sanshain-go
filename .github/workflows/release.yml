name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binaries are built with the current Go, so they carry its standard
      # library fixes; the floor for `go install` stays the go.mod directive,
      # which the build workflow tests.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/sanshain-go-linux-amd64 ./cmd/sanshain-go
          GOOS=linux GOARCH=arm64 go build -o dist/sanshain-go-linux-arm64 ./cmd/sanshain-go
          GOOS=darwin GOARCH=amd64 go build -o dist/sanshain-go-darwin-amd64 ./cmd/sanshain-go
          GOOS=darwin GOARCH=arm64 go build -o dist/sanshain-go-darwin-arm64 ./cmd/sanshain-go
          GOOS=windows GOARCH=amd64 go build -o dist/sanshain-go-windows-amd64.exe ./cmd/sanshain-go

      - name: Upload Release Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: CHANGELOG.md
          files: |
            dist/sanshain-go-linux-amd64
            dist/sanshain-go-linux-arm64
            dist/sanshain-go-darwin-amd64
            dist/sanshain-go-darwin-arm64
            dist/sanshain-go-windows-amd64.exe
