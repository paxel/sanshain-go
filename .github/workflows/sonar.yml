# SonarQube Cloud analysis of summer on every push there; the free plan
# analyses the main branch only. Report only: the quality gate shows on
# https://sonarcloud.io/summary/new_code?id=paxel_sanshain-go and fails no
# build. Coverage comes from the same go test run. What is analysed is in
# sonar-project.properties.
#
# One-time setup: the project paxel_sanshain-go on SonarQube Cloud with
# Automatic Analysis off, and the repository secret SQ_TOKEN.
name: SonarQube Cloud

on:
  push:
    branches: [summer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      # The full history for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: true
      - name: Tests with coverage
        run: go test -coverprofile=coverage.out ./...
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
