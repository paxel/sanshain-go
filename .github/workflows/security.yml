# Fails only when a dependency has a known vulnerability (Go vulnerability database, only for code the module actually calls). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# The same scan also runs in CI on every push and pull request (build.yml, same job name).
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerable Go modules (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The current Go, not the 1.26 floor: the floor is a compatibility promise, and
      # an unsupported Go's own standard-library advisories would keep this red with
      # nothing to fix here. Dependencies are checked the same either way.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: govulncheck
        run: go tool govulncheck ./...
