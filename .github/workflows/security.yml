# Fails only when a dependency has a known vulnerability (Go vulnerability database, only for code the module actually calls). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerable Go modules (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
