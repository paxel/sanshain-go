name: Fuzz

# The fuzz functions beside the code (go test -fuzz), weekly and by hand, from paxel/gates:
# what the client reads but did not write. FuzzConfig is sanshain.yaml, FuzzAnnotations is the
# filling of the placeholders in annotation values, FuzzResponse is the body and the warning
# headers of an answer of the service, FuzzState is the require state file. A crash fails the
# job and leaves its input in testdata/fuzz/<function>/ of the package, where `go test` replays
# it.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    with:
      stack: go
      targets: |
        internal/config FuzzConfig
        internal/api FuzzAnnotations
        internal/api FuzzResponse
        internal/cache FuzzState
