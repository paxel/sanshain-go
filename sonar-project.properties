# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-go
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-go
sonar.projectName=sanshain-go

# Go keeps its tests next to the code: the test files are the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Coverage: the workflow's go test -coverprofile run.
sonar.go.coverage.reportPaths=coverage.out

# Accepted findings, each limited to its rule and its single file, so a new
# file with the same finding is still reported.
sonar.issue.ignore.multicriteria=tlscert,tlshost

# --insecure is the user's explicit opt-in for an instance with a self-signed
# certificate: only then does the client skip certificate and hostname
# verification; without the flag the default TLS settings apply.
sonar.issue.ignore.multicriteria.tlscert.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.tlscert.resourceKey=internal/api/client.go
sonar.issue.ignore.multicriteria.tlshost.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.tlshost.resourceKey=internal/api/client.go
