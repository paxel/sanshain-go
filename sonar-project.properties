# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-go
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-go
sonar.projectName=sanshain-go

# Go keeps its tests next to the code: the test files are the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Coverage: the workflow's go test -coverprofile run.
sonar.go.coverage.reportPaths=coverage.out
