# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-go
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-go
sonar.projectName=sanshain-go

# Go keeps its tests next to the code: the test files are the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Coverage: the shared Go gate runs the tests with -coverprofile and keeps coverage/go.out,
# which the sonar job downloads.
sonar.go.coverage.reportPaths=coverage/go.out
