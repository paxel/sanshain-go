# Accepted findings. The release and the weekly Security run (paxel/gates release-gate.yml)
# fail on every open code-scanning alert, of any tool and severity, every open
# secret-scanning alert, and every open SonarQube Cloud issue and hotspot to review that is not
# listed here. Each entry says why the finding stays and
# when the gate fails again: that is the review. Then fix it, or move the date with a reason.
# Nothing is dismissed in GitHub or marked in SonarQube Cloud.
#
# [[IgnoredAlerts]]   tool, rule (as GitHub reports them), path, reason, ignoreUntil
#                     path is the file the finding is in; the entry covers that file only.
#                     Leave it out only for a finding without a file (Scorecard's
#                     repository-level ones); left out for a finding in a file, it blocks.
#                     A SonarQube Cloud finding has tool = "SonarQube Cloud" and the rule
#                     as SonarQube Cloud writes it, e.g. "pythonsecurity:S8707".
# [[IgnoredSecrets]]  secret_type, reason, ignoreUntil

# The two findings sonar-project.properties used to silence. Both are the one place where
# --insecure switches the verification of the service's certificate off.
[[IgnoredAlerts]]
tool = "SonarQube Cloud"
rule = "go:S4830"
path = "internal/api/client.go"
ignoreUntil = 2027-02-18
reason = """--insecure is the user's explicit choice for an instance with a self-signed \
certificate: only then does the client skip the verification of the certificate. Without the \
flag the default TLS settings apply."""

[[IgnoredAlerts]]
tool = "SonarQube Cloud"
rule = "go:S5527"
path = "internal/api/client.go"
ignoreUntil = 2027-02-18
reason = """--insecure is the user's explicit choice for an instance with a self-signed \
certificate: only then does the client skip the verification of the host name. Without the \
flag the default TLS settings apply."""
